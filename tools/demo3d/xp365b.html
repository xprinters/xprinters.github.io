<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XP-365B — установка рулона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6eddd; --card: #f9f2e5; --line: #cec0ad; --line-soft: #e2d7c7;
    --navy: #18213d; --ink: #4f535b; --muted: #8a8378; --teal: #1aa3a1; --green: #2fa84f;
    --sans: "Barlow", system-ui, sans-serif; --cond: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header .logo { width: 34px; height: 34px; border: 2px solid var(--navy); border-radius: 8px; display: grid; place-items: center; font: 700 15px var(--cond); color: var(--navy); }
  header h1 { margin: 0; font: 700 22px var(--cond); letter-spacing: .14em; text-transform: uppercase; color: var(--navy); }
  header .sub { font: 500 11px var(--cond); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  header .prog { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 600 12px var(--cond); letter-spacing: .12em; color: var(--navy); text-transform: uppercase; }
  .bar { width: 140px; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .4s; }

  #stage { position: relative; overflow: hidden; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  #labels svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .co { position: absolute; max-width: 210px; padding: 8px 11px; background: rgba(249,242,229,.94); border: 1px solid var(--line);
        border-radius: 6px; font-size: 12.5px; line-height: 1.35; color: var(--ink); opacity: 0; transition: opacity .35s; }
  .co.on { opacity: 1; }
  .co b { display: block; font: 700 12px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--navy); margin-bottom: 2px; }
  .hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--navy); color: #f6eddd;
          font: 600 11px var(--cond); letter-spacing: .08em; padding: 5px 10px; border-radius: 5px; }

  aside { border-left: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; min-height: 0; }
  aside .tabs { display: flex; gap: 18px; padding: 14px 18px 0; border-bottom: 1px solid var(--line); font: 600 12px var(--cond); letter-spacing: .12em; text-transform: uppercase; }
  aside .tabs span { padding-bottom: 10px; color: var(--muted); }
  aside .tabs span.on { color: var(--navy); border-bottom: 2px solid var(--navy); }
  ol { list-style: none; margin: 0; padding: 10px; overflow: auto; flex: 1; }
  li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  li:hover { background: rgba(24,33,61,.04); }
  li.on { background: #fff; border-color: var(--line); }
  li .n { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font: 700 12px var(--cond); color: var(--muted); }
  li.on .n { background: var(--navy); border-color: var(--navy); color: #fff; }
  li.done .n { border-color: var(--teal); color: var(--teal); }
  li h3 { margin: 3px 0 0; font: 600 15px var(--cond); color: var(--navy); }
  li p { margin: 4px 0 0; font-size: 13px; line-height: 1.4; display: none; }
  li.on p { display: block; }
  .ctl { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .ctl button { flex: 1; height: 38px; border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--navy);
                font: 600 13px var(--cond); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
  .ctl button.pri { background: var(--navy); color: #fff; border-color: var(--navy); }
  .ctl button:disabled { opacity: .4; cursor: default; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 52vh 1fr; }
    header .sub, header .bar, .hint { display: none; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .co { max-width: 150px; font-size: 11px; padding: 6px 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">XP</div>
  <div><h1>XP-365B</h1><div class="sub">Установка рулона · по шагам</div></div>
  <div class="prog"><span id="pn">Шаг 1 / 8</span><div class="bar"><i id="pb"></i></div></div>
</header>
<div id="stage">
  <div id="labels"><svg id="leaders"></svg></div>
  <div class="hint">Тяните — вращать · колесо / щипок — масштаб</div>
</div>
<aside>
  <div class="tabs"><span class="on">Инструкция</span><span>Схема</span><span>Видео</span></div>
  <ol id="steps"></ol>
  <div class="ctl"><button id="prev">← Назад</button><button id="next" class="pri">Далее →</button></div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------- сцена (единицы — миллиметры; габариты XP-365B 140 × 212 × 144) ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f6eddd');
const camera = new THREE.PerspectiveCamera(32, 1, 5, 5000);
camera.position.set(420, 330, 520);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 70, 0);
controls.enableDamping = true;
controls.minDistance = 220; controls.maxDistance = 1300;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight('#fffaf0', '#c9b9a0', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(260, 520, 300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 1500 });
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun);
const fill = new THREE.DirectionalLight('#dfe8ff', 0.7);
fill.position.set(-400, 200, -100);
scene.add(fill);

// «миллиметровка» под принтером
const grid = new THREE.GridHelper(1400, 70, '#d9ccb8', '#e6dccb');
grid.position.y = -0.5;
scene.add(grid);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const INK = new THREE.LineBasicMaterial({ color: '#18213d', transparent: true, opacity: 0.35 });
const M = {
  body: new THREE.MeshStandardMaterial({ color: '#2a2d32', roughness: 0.55 }),
  cover: new THREE.MeshStandardMaterial({ color: '#25282d', roughness: 0.45 }),
  inner: new THREE.MeshStandardMaterial({ color: '#1b1d21', roughness: 0.8 }),
  grey: new THREE.MeshStandardMaterial({ color: '#8d9299', roughness: 0.4, metalness: 0.3 }),
  rubber: new THREE.MeshStandardMaterial({ color: '#141518', roughness: 0.9 }),
  head: new THREE.MeshStandardMaterial({ color: '#3b4048', roughness: 0.35, metalness: 0.5 }),
  green: new THREE.MeshStandardMaterial({ color: '#2fa84f', roughness: 0.5 }),
  btn: new THREE.MeshStandardMaterial({ color: '#c9ccd1', roughness: 0.4 }),
  core: new THREE.MeshStandardMaterial({ color: '#b48a5a', roughness: 0.9 }),
};

function part(geo, mat, x, y, z, parent, edges = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 35), INK));
  parent.add(m);
  return m;
}
const rbox = (w, h, d, r = 6) => new RoundedBoxGeometry(w, h, d, 4, r);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);

const printer = new THREE.Group();
scene.add(printer);

// ---------- корпус: ванна под рулон + передняя панель ----------
part(rbox(140, 16, 212, 6), M.body, 0, 8, 0, printer);                     // дно
part(rbox(7, 90, 212, 3), M.body, -66.5, 45, 0, printer);                  // левая стенка
part(rbox(7, 90, 212, 3), M.body, 66.5, 45, 0, printer);                   // правая стенка
part(rbox(140, 90, 8, 3), M.body, 0, 45, -102, printer);                   // задняя стенка
part(box(126, 2, 150), M.inner, 0, 16.5, -20, printer, false);             // пол отсека
part(rbox(140, 124, 40, 10), M.body, 0, 62, 86, printer);                  // передняя панель
part(box(120, 22, 14), M.head, 0, 69, 55, printer);                        // печатающая головка
part(box(118, 1.5, 6), new THREE.MeshStandardMaterial({ color: '#7a6a3a', roughness: .3, metalness: .6 }), 0, 80.6, 55, printer, false);

// кнопки открытия крышки по бокам
for (const sx of [-1, 1]) part(rbox(3, 16, 22, 1.5), M.btn, sx * 70.5, 76, 38, printer);

// лицевая панель: овал с кнопками и подписями, табличка Xprinter
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const panelTex = canvasTex(512, 160, g => {
  g.fillStyle = '#3a3e45'; g.beginPath(); g.roundRect(6, 6, 500, 148, 74); g.fill();
  g.font = '600 17px Barlow, sans-serif'; g.fillStyle = '#c7cbd1'; g.textAlign = 'center';
  [['POWER', 110], ['STATUS', 205], ['PAUSE', 305], ['FEED', 400]].forEach(([t, x]) => g.fillText(t, x, 128));
});
const panel = new THREE.Mesh(new THREE.PlaneGeometry(96, 30), new THREE.MeshStandardMaterial({ map: panelTex, roughness: .6 }));
panel.position.set(0, 26, 106.2);
printer.add(panel);
const led = new THREE.Mesh(new THREE.CircleGeometry(2.6, 24), new THREE.MeshStandardMaterial({ color: '#555', emissive: '#000' }));
led.position.set(-75 * 96 / 512 + 0, 0, 0);
led.position.set(110 / 512 * 96 - 48, 26 + 2, 106.4);
printer.add(led);
const led2 = led.clone(); led2.material = led.material.clone(); led2.position.x = 205 / 512 * 96 - 48; printer.add(led2);
const btnPause = part(new THREE.CylinderGeometry(4, 4, 2.4, 28).rotateX(Math.PI / 2), M.btn, 305 / 512 * 96 - 48, 28, 106.6, printer);
const btnFeed = part(new THREE.CylinderGeometry(4, 4, 2.4, 28).rotateX(Math.PI / 2), M.btn, 400 / 512 * 96 - 48, 28, 106.6, printer);
const logo = new THREE.Mesh(new THREE.PlaneGeometry(30, 8), new THREE.MeshStandardMaterial({ map: canvasTex(240, 64, g => {
  g.fillStyle = '#3d7fd6'; g.fillRect(0, 0, 240, 64); g.fillStyle = '#fff'; g.font = 'italic 600 34px Barlow, sans-serif';
  g.textAlign = 'center'; g.fillText('Xprinter', 120, 44);
}) }));
logo.position.set(0, 76, 106.2);
printer.add(logo);
part(rbox(4, 10, 6, 1), M.inner, 70.5, 18, -70, printer);                // выключатель питания

// ---------- крышка на петле сзади ----------
const coverPivot = new THREE.Group();
coverPivot.position.set(0, 90, -104);
printer.add(coverPivot);
const cover = part(rbox(140, 54, 168, 10), M.cover, 0, 27, 84, coverPivot);
const platen = part(new THREE.CylinderGeometry(7, 7, 118, 32).rotateZ(Math.PI / 2), M.rubber, 0, -2, 160, coverPivot);

// ---------- направляющие ----------
part(box(5, 30, 24), M.green, -61.5, 31, 14, printer);
part(box(12, 2, 24), M.green, -57, 45, 14, printer);
const slider = new THREE.Group();
printer.add(slider);
part(box(5, 30, 24), M.green, 2.5, 31, 14, slider);
part(box(12, 2, 24), M.green, -2, 45, 14, slider);

// ---------- рулон 58 × 40 на втулке 25,4 мм, вал с ограничителем ----------
const R = 35, CORE = 12.7, PW = 58;
const labelTex = canvasTex(64, 430, g => {
  g.fillStyle = '#f2efe8'; g.fillRect(0, 0, 64, 430);                      // подложка
  g.fillStyle = '#ffffff'; g.beginPath(); g.roundRect(3, 15, 58, 400, 14); g.fill();   // этикетка 40 мм + зазор 3 мм
});
labelTex.wrapS = labelTex.wrapT = THREE.RepeatWrapping;
const paperMat = new THREE.MeshStandardMaterial({ map: labelTex, roughness: .85, side: THREE.DoubleSide });

const rollG = new THREE.Group();
scene.add(rollG);
const rollBody = new THREE.Group(); rollG.add(rollBody);
const sideTex = canvasTex(256, 256, g => {
  g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(120,110,90,.18)';
  for (let r = 40; r < 128; r += 3) { g.beginPath(); g.arc(128, 128, r, 0, 7); g.stroke(); }
});
part(new THREE.CylinderGeometry(R, R, PW, 64, 1, true).rotateZ(Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#f7f5f0', roughness: .9 }), 0, 0, 0, rollBody, false);
for (const sx of [-1, 1]) {
  const cap = new THREE.Mesh(new THREE.RingGeometry(CORE + 2, R, 64), new THREE.MeshStandardMaterial({ map: sideTex, roughness: .9, side: THREE.DoubleSide }));
  cap.rotation.y = sx * Math.PI / 2; cap.position.x = sx * PW / 2;
  rollBody.add(cap);
}
part(new THREE.CylinderGeometry(CORE + 2, CORE + 2, PW + 0.5, 40, 1, true).rotateZ(Math.PI / 2), M.core, 0, 0, 0, rollBody, false).material.side = THREE.DoubleSide;
// метка начала ленты, чтобы было видно вращение
part(box(PW, 0.6, 6), new THREE.MeshStandardMaterial({ color: '#e5e0d4' }), 0, R + 0.2, 0, rollBody, false);

const spindle = new THREE.Group();
scene.add(spindle);
part(new THREE.CylinderGeometry(10, 10, 124, 32).rotateZ(Math.PI / 2), M.grey, 0, 0, 0, spindle);
const limiter = part(new THREE.CylinderGeometry(26, 26, 3, 48).rotateZ(Math.PI / 2), M.green, 50, 0, 0, spindle);

// ---------- лента: полоса вдоль пути от низа рулона через головку в щель ----------
const ROLL_X = -62 + PW / 2 + 1, ROLL_Y = 17 + R + 1, ROLL_Z = -32;
const path = new THREE.CatmullRomCurve3([
  [ROLL_Z, ROLL_Y - R], [ROLL_Z + 28, 18.5], [12, 21], [30, 38], [46, 76], [55, 81.6], [61, 83.5], [64, 93], [64.5, 110], [64.5, 124], [64.5, 220],
].map(([z, y]) => new THREE.Vector3(ROLL_X, y, z)), false, 'centripetal');
const PTS = path.getSpacedPoints(600), TOTAL = path.getLength();
const lenWhere = f => { const i = PTS.findIndex(f); return i / 600 * TOTAL; };
const L_HEAD = lenWhere(p => p.z >= 60), L_OUT = lenWhere(p => p.z > 63 && p.y >= 134), L_FEED = lenWhere(p => p.z > 63 && p.y >= 177);
const paperGeo = new THREE.BufferGeometry();
const paper = new THREE.Mesh(paperGeo, paperMat);
paper.castShadow = true;
scene.add(paper);
let builtLen = -1, builtShift = 0;
function buildPaper(len, shift) {
  if (Math.abs(len - builtLen) < 0.05 && shift === builtShift) return;
  builtLen = len; builtShift = shift;
  paper.visible = len > 0.5;
  if (!paper.visible) return;
  const n = Math.max(2, Math.ceil(len / 2)), pos = [], uv = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const s = len * i / n, p = path.getPointAt(Math.min(1, s / TOTAL));
    pos.push(p.x - PW / 2, p.y + 0.4, p.z, p.x + PW / 2, p.y + 0.4, p.z);
    const v = (s - shift) / 43;
    uv.push(0, v, 1, v);
    if (i) idx.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
  }
  paperGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  paperGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  paperGeo.setIndex(idx);
  paperGeo.deleteAttribute('normal');   // иначе остаётся буфер нормалей прошлой длины
  paperGeo.computeVertexNormals();
  paperGeo.computeBoundingSphere();
}

// ---------- шаги ----------
const TABLE_ROLL = new THREE.Vector3(150, R, 60), TABLE_SPINDLE = new THREE.Vector3(170, 10, -80);
const ABOVE = 215;
const STEPS = [
  { t: 'Знакомство', d: 'XP-365B печатает без краски: изображение проявляется нагревом термоэтикетки. Печатающая головка внизу, поэтому лента идёт этикетками вниз.',
    s: { cover: 0, stage: 0, lim: 50, guide: 50, paper: 0, power: 0 }, cam: [420, 330, 520], tgt: [20, 70, 0],
    co: [['cover', 'Крышка', 'Открывается вверх, петля сзади', 40, -150], ['openbtn', 'Кнопки открытия', 'По одной на каждом боку', 120, -40],
         ['panel', 'PAUSE · FEED', 'FEED — выдать этикетку, PAUSE — вернуть', -40, 110], ['roll', 'Рулон 58 × 40', 'Термоэтикетки, втулка 25 или 40 мм', 60, 70]] },
  { t: 'Откройте крышку', d: 'Нажмите кнопки по бокам и поднимите крышку до упора.',
    s: { cover: 1, stage: 0, lim: 50, guide: 50, paper: 0, power: 0 }, cam: [330, 420, 430], tgt: [0, 70, 10],
    co: [['openbtn', 'Нажмите здесь', 'Кнопки с обеих сторон', 120, 20], ['head', 'Печатающая головка', 'Внизу, в корпусе', -260, 40], ['platen', 'Резиновый вал', 'На крышке, прижимает ленту к головке', -240, -60]] },
  { t: 'Наденьте рулон на вал', d: 'Проденьте вал через втулку рулона. Ограничитель — справа, придвиньте к рулону с небольшим запасом.',
    s: { cover: 1, stage: 1, lim: -2, guide: 50, paper: 0, power: 0 }, cam: [260, 420, 460], tgt: [0, 150, -10],
    co: [['limiter', 'Ограничитель — справа', 'Рулон должен свободно вращаться', 90, -70], ['spindle', 'Вал', 'Стороной с выступами вверх — для втулки 25 мм', -230, -80]] },
  { t: 'Положите рулон в отсек', d: 'Лента сходит с рулона снизу, этикетками вниз. Рулон — максимально по левому краю.',
    s: { cover: 1, stage: 2, lim: -2, guide: 50, paper: 0.55, power: 0 }, cam: [120, 620, 300], tgt: [-20, 30, 0],
    co: [['rollbottom', 'Лента — из-под рулона', 'Этикетками вниз, к головке', -230, 60], ['roll', 'По левому краю', 'Вплотную к левой стенке', 70, -110]] },
  { t: 'Заправьте в направляющие', d: 'Пропустите ленту через левую зелёную направляющую — в ней датчик бумаги. Правый бегунок сдвиньте к ленте, но не зажимайте.',
    s: { cover: 1, stage: 2, lim: -2, guide: -2, paper: 1, power: 0 }, cam: [90, 470, 300], tgt: [-25, 30, 20],
    co: [['lguide', 'Датчик бумаги', 'В левой зелёной направляющей', -240, -40], ['slider', 'Правый бегунок', 'К краю ленты, без зажима', 90, -70]] },
  { t: 'Вытяните ленту на 1 см', d: 'Протяните край ленты над головкой так, чтобы он выходил за корпус примерно на 1 см.',
    s: { cover: 1, stage: 2, lim: -2, guide: -2, paper: 2, power: 0 }, cam: [260, 360, 420], tgt: [-10, 80, 30],
    co: [['exit', '≈ 1 см наружу', 'Иначе принтер не увидит бумагу', -250, -60]] },
  { t: 'Закройте крышку до щелчка', d: 'Прижмите крышку обеими руками до щелчка с обеих сторон.',
    s: { cover: 0, stage: 2, lim: -2, guide: -2, paper: 2, power: 0 }, cam: [380, 300, 480], tgt: [0, 70, 0],
    co: [['cover', 'До щелчка', 'Неплотно закрытая крышка — красный индикатор', 40, -150]] },
  { t: 'Включите — калибровка сама', d: 'При включении принтер сам прогонит ленту и встанет между этикетками. Лишнюю этикетку верните кнопкой PAUSE.',
    s: { cover: 0, stage: 2, lim: -2, guide: -2, paper: 2, power: 1 }, cam: [300, 220, 520], tgt: [0, 80, 40], loop: true,
    co: [['led', 'Синий — готов', 'Красный — нет бумаги или открыта крышка', -250, 40], ['exit', 'Автокалибровка', 'Выйдет одна этикетка', 70, -120], ['pause', 'PAUSE', 'Вернёт этикетку внутрь', 90, 60]] },
];

// точки привязки выносок
const tmp = new THREE.Vector3();
const ANCH = {
  cover: () => cover.localToWorld(tmp.set(0, 27, -10)),
  openbtn: () => tmp.set(72, 76, 38),
  panel: () => tmp.set(15, 26, 107),
  head: () => tmp.set(-30, 81, 55),
  platen: () => platen.localToWorld(tmp.set(-30, 0, 0)),
  roll: () => rollG.localToWorld(tmp.set(0, R * 0.7, R * 0.7)),
  rollbottom: () => tmp.set(ROLL_X - 10, 19, ROLL_Z + 30),
  limiter: () => limiter.localToWorld(tmp.set(0, 18, 0)),
  spindle: () => spindle.localToWorld(tmp.set(-58, 0, 0)),
  lguide: () => tmp.set(-61, 45, 14),
  slider: () => slider.localToWorld(tmp.set(2.5, 45, 14)),
  exit: () => tmp.set(ROLL_X, 128, 65),
  led: () => led.getWorldPosition(tmp),
  pause: () => btnPause.getWorldPosition(tmp),
};

// ---------- анимация состояния ----------
const cur = { ...STEPS[0].s }, from = { ...cur };
let step = 0, tStart = 0, DUR = 1400;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const v3 = new THREE.Vector3();

function placeRoll(stage) {
  // 0 — на столе, 1 — над принтером на валу, 2 — в отсеке. Сначала подъём, потом сдвиг по оси
  const posAt = (k, table, x) => k === 0 ? table : k === 1 ? v3.set(x, ABOVE, ROLL_Z) : v3.set(x, ROLL_Y, ROLL_Z);
  const a = Math.floor(Math.min(stage, 1.999)), f = stage - a;
  const lerpPos = (obj, table, x) => {
    const p0 = posAt(a, table, x).clone(), p1 = posAt(a + 1, table, x).clone();
    if (a === 0) {   // со стола: вверх, затем вбок
      const fy = ease(f / 0.55), fx = ease((f - 0.35) / 0.65);
      obj.position.set(lerp(p0.x, p1.x, fx), lerp(p0.y, p1.y, fy), lerp(p0.z, p1.z, fy));
    } else obj.position.lerpVectors(p0, p1, ease(f));
  };
  lerpPos(rollG, TABLE_ROLL, ROLL_X);
  lerpPos(spindle, TABLE_SPINDLE, 0);
}

function apply(s, time) {
  coverPivot.rotation.x = -s.cover * 1.85;
  placeRoll(s.stage);
  limiter.position.x = s.lim;
  slider.position.x = s.guide;
  let len = s.paper <= 1 ? s.paper * L_HEAD : lerp(L_HEAD, L_OUT, s.paper - 1), shift = 0;
  if (STEPS[step].loop && step === STEPS.length - 1) {
    // цикл: включение → прогон одной этикетки → пауза → PAUSE возвращает её
    const c = (time / 1000) % 7;
    const out = c < 1.2 ? 0 : c < 3 ? ease((c - 1.2) / 1.8) : c < 4.6 ? 1 : c < 5.8 ? 1 - ease((c - 4.6) / 1.2) : 0;
    len = lerp(L_OUT, L_FEED, out);
    shift = (L_FEED - L_OUT) * out;
    rollBody.rotation.x = -(L_FEED - L_OUT) * out / R;
    btnPause.position.z = 106.6 - (c > 4.3 && c < 4.7 ? 1.2 : 0);
    led.material.emissive.set(c < 1.2 ? '#000' : '#2f7bff'); led.material.color.set(c < 1.2 ? '#555' : '#9cc2ff');
    led2.material.emissive.set(c < 1.2 && c > 0.3 ? '#ff2a2a' : '#000');
  } else {
    led.material.emissive.set('#000'); led.material.color.set('#555'); led2.material.emissive.set('#000');
    btnPause.position.z = 106.6;
    rollBody.rotation.x = -len / R * 0.15;
  }
  buildPaper(s.stage > 1.95 ? len : 0, shift);
}

// ---------- выноски ----------
const labelsEl = document.getElementById('labels'), svg = document.getElementById('leaders');
let cards = [];
function makeCallouts() {
  cards.forEach(c => c.el.remove());
  svg.innerHTML = '';
  cards = STEPS[step].co.map(([k, title, text, dx, dy]) => {
    const el = document.createElement('div');
    el.className = 'co';
    el.innerHTML = `<b>${title}</b>${text}`;
    labelsEl.appendChild(el);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#18213d'); line.setAttribute('stroke-width', '1.2');
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', '4'); dot.setAttribute('fill', '#1aa3a1'); dot.setAttribute('stroke', '#f6eddd'); dot.setAttribute('stroke-width', '2');
    svg.append(line, dot);
    return { k, el, line, dot, dx, dy };
  });
  setTimeout(() => cards.forEach(c => c.el.classList.add('on')), 500);
}
function placeCallouts() {
  const w = stage.clientWidth, h = stage.clientHeight, sc = w < 600 ? 0.6 : 1;
  for (const c of cards) {
    const p = ANCH[c.k]().clone().project(camera);
    const x = (p.x + 1) / 2 * w, y = (1 - p.y) / 2 * h;
    let bx = x + c.dx * sc, by = y + c.dy * sc;
    const bw = c.el.offsetWidth, bh = c.el.offsetHeight;
    bx = Math.max(8, Math.min(w - bw - 8, bx)); by = Math.max(8, Math.min(h - bh - 40, by));
    c.el.style.transform = `translate(${bx}px,${by}px)`;
    // линия от точки к ближнему краю карточки, с изломом
    const ex = x < bx ? bx : x > bx + bw ? bx + bw : bx + bw / 2;
    const ey = by + bh / 2;
    const mx = ex + (x < bx ? -14 : x > bx + bw ? 14 : 0);
    c.line.setAttribute('points', `${x},${y} ${mx},${ey} ${ex},${ey}`);
    c.dot.setAttribute('cx', x); c.dot.setAttribute('cy', y);
  }
}

// ---------- камера ----------
let camFrom = null, camTo = null, camT0 = 0, userMoved = false;
controls.addEventListener('start', () => { userMoved = true; camTo = null; });
function flyCamera() {
  camFrom = { p: camera.position.clone(), t: controls.target.clone() };
  camTo = { p: new THREE.Vector3(...STEPS[step].cam), t: new THREE.Vector3(...STEPS[step].tgt) };
  camT0 = performance.now();
}

// ---------- шаги в панели ----------
const ol = document.getElementById('steps');
ol.innerHTML = STEPS.map((s, i) => `<li data-i="${i}"><div class="n">${i + 1}</div><div><h3>${s.t}</h3><p>${s.d}</p></div></li>`).join('');
ol.addEventListener('click', e => { const li = e.target.closest('li'); if (li) go(+li.dataset.i); });
const prevB = document.getElementById('prev'), nextB = document.getElementById('next');
prevB.onclick = () => go(step - 1);
nextB.onclick = () => go(step + 1 < STEPS.length ? step + 1 : 0);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') nextB.click(); if (e.key === 'ArrowLeft' && step) prevB.click(); });

function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  Object.assign(from, cur);
  step = i; tStart = performance.now();
  [...ol.children].forEach((li, j) => { li.classList.toggle('on', j === i); li.classList.toggle('done', j < i); });
  ol.children[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('pn').textContent = `Шаг ${i + 1} / ${STEPS.length}`;
  document.getElementById('pb').style.width = (i + 1) / STEPS.length * 100 + '%';
  prevB.disabled = i === 0;
  nextB.textContent = i === STEPS.length - 1 ? 'Сначала ↺' : 'Далее →';
  makeCallouts();
  flyCamera();
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

function frame(now) {
  try { frame0(now); } catch (e) { window.__err = e.stack; throw e; }
}
function frame0(now) {
  const k = ease((now - tStart) / DUR), tgt = STEPS[step].s;
  for (const key in tgt) cur[key] = lerp(from[key], tgt[key], k);
  apply(cur, now - tStart - DUR);
  if (camTo) {
    const f = ease((now - camT0) / 1600);
    camera.position.lerpVectors(camFrom.p, camTo.p, f);
    controls.target.lerpVectors(camFrom.t, camTo.t, f);
    if (f >= 1) camTo = null;
  }
  controls.update();
  renderer.render(scene, camera);
  placeCallouts();
  requestAnimationFrame(frame);
}
window.__d = { paper, paperGeo, paperMat, scene, camera, controls, THREE };
resize();
go(0);
requestAnimationFrame(frame);
</script>
</body>
